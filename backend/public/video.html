<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustLens - Video Analysis Deep Dive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --surface-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, var(--bg-color));
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 4rem;
            padding-bottom: 4rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 0 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-top: 0.5rem;
        }

        .glass-card {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin-bottom: 2rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        label {
            font-weight: 600;
            color: var(--text-primary);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            gap: 1rem;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .button-loading .spinner {
            display: inline-block;
        }
        
        .button-loading span {
            display: none;
        }

        /* Results Area */
        .hidden {
            display: none !important;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .transcript-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 1.5rem;
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 1.5rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            margin-left: 1rem;
        }

        /* Analysis Results */
        .score-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .score-circ {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            border: 4px solid var(--surface-border);
        }

        .high-risk .score-circ { border-color: var(--danger); color: #fca5a5; }
        .medium-risk .score-circ { border-color: var(--warning); color: #fcd34d; }
        .low-risk .score-circ { border-color: var(--success); color: #6ee7b7; }

        .analysis-text {
            color: #cbd5e1;
            line-height: 1.6;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .tag {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .error-message {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin-top: 1rem;
            font-weight: 500;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Video Analysis</h1>
            <p>Paste a video link to extract speech-to-text audio and run deep analysis.</p>
        </div>

        <!-- Step 1: Input -->
        <div class="glass-card">
            <div class="input-group">
                <label for="videoUrl">Video URL (YouTube, Instagram, TikTok)</label>
                <div class="input-wrapper">
                    <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
                    <button id="extractBtn" onclick="extractAudio()">
                        <div class="spinner"></div>
                        <span>Extract Audio</span>
                    </button>
                </div>
                <div id="errorBox" class="error-message hidden"></div>
            </div>
        </div>

        <!-- Step 2: Transcript -->
        <div id="transcriptSection" class="glass-card hidden">
            <div class="section-title">
                🎙️ Extracted Speech Audio
                <span id="platformBadge" class="badge">Platform</span>
            </div>
            <div id="transcriptBox" class="transcript-box"></div>
            
            <button id="analyzeBtn" onclick="analyzeVideo()" style="width: 100%;">
                <div class="spinner"></div>
                <span>⚡ Run AI Deep Analysis</span>
            </button>
        </div>

        <!-- Step 3: Analysis Results -->
        <div id="analysisSection" class="glass-card hidden">
            <div class="section-title">🤖 AI Analysis Results</div>
            
            <div id="scoreRow" class="score-row">
                <div>
                    <h3 style="margin: 0; font-size: 1.5rem;" id="verdictText">Verdict</h3>
                    <p style="margin: 0.5rem 0 0 0; color: var(--text-secondary);" id="riskText">Risk Level</p>
                </div>
                <div class="score-circ" id="scoreCirc">0</div>
            </div>

            <div class="section-title" style="font-size: 1rem;">Summary</div>
            <p id="analysisSummary" class="analysis-text"></p>

            <div class="section-title" style="font-size: 1rem; margin-top: 1.5rem;">Detected Manipulations</div>
            <div id="manipulationTags" class="tag-list"></div>
        </div>
    </div>

    <script>
        let currentTranscript = null;
        let currentUrl = null;

        async function extractAudio() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const extractBtn = document.getElementById('extractBtn');
            const errorBox = document.getElementById('errorBox');
            
            if (!urlInput) {
                showError("Please enter a valid video URL.");
                return;
            }

            // UI Reset
            errorBox.classList.add('hidden');
            document.getElementById('transcriptSection').classList.add('hidden');
            document.getElementById('analysisSection').classList.add('hidden');
            extractBtn.classList.add('button-loading');
            extractBtn.disabled = true;

            try {
                const response = await fetch('/api/video/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ videoUrl: urlInput })
                });

                const data = await response.json();

                if (data.success) {
                    currentTranscript = data.transcript;
                    currentUrl = urlInput;
                    
                    document.getElementById('transcriptBox').textContent = data.transcript;
                    document.getElementById('platformBadge').textContent = `${data.platform} (${data.tier})`;
                    document.getElementById('transcriptSection').classList.remove('hidden');
                } else {
                    showError(data.error || "Failed to extract audio. Ensure the video has spoken words or subtitles.");
                }
            } catch (err) {
                showError("Network error. Make sure the TrustLens backend is running.");
            } finally {
                extractBtn.classList.remove('button-loading');
                extractBtn.disabled = false;
            }
        }

        async function analyzeVideo() {
            const analyzeBtn = document.getElementById('analyzeBtn');
            const errorBox = document.getElementById('errorBox');

            errorBox.classList.add('hidden');
            document.getElementById('analysisSection').classList.add('hidden');
            analyzeBtn.classList.add('button-loading');
            analyzeBtn.disabled = true;

            try {
                const response = await fetch('/api/video/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        videoUrl: currentUrl,
                        transcript: currentTranscript
                    })
                });

                const data = await response.json();

                if (data.success && data.analysis) {
                    const ans = data.analysis;
                    
                    // Populate UI
                    document.getElementById('verdictText').textContent = ans.verdict || 'Unknown';
                    document.getElementById('riskText').textContent = `${(ans.riskLevel || 'neutral').toUpperCase()} RISK`;
                    document.getElementById('scoreCirc').textContent = ans.credibilityScore || '50';
                    document.getElementById('analysisSummary').textContent = ans.explanation || 'No explanation provided.';

                    // Theme the score
                    const scoreRow = document.getElementById('scoreRow');
                    scoreRow.className = 'score-row'; // reset
                    const risk = (ans.riskLevel || '').toLowerCase();
                    if (risk === 'high') scoreRow.classList.add('high-risk');
                    else if (risk === 'medium') scoreRow.classList.add('medium-risk');
                    else scoreRow.classList.add('low-risk');

                    // Tags
                    const tagContainer = document.getElementById('manipulationTags');
                    tagContainer.innerHTML = '';
                    
                    let issues = [];
                    if (ans.llmAnalysis) {
                        if (ans.llmAnalysis.manipulativeStatements) issues.push(...ans.llmAnalysis.manipulativeStatements);
                        if (ans.llmAnalysis.inconsistencies) issues.push(...ans.llmAnalysis.inconsistencies);
                    }
                    if (issues.length === 0) issues = ["No manipulative techniques detected"];

                    issues.forEach(issue => {
                        const el = document.createElement('span');
                        el.className = 'tag';
                        if (issue === "No manipulative techniques detected") {
                            el.style.background = 'rgba(16, 185, 129, 0.2)';
                            el.style.color = '#6ee7b7';
                            el.style.borderColor = 'rgba(16, 185, 129, 0.3)';
                        }
                        el.textContent = issue;
                        tagContainer.appendChild(el);
                    });

                    document.getElementById('analysisSection').classList.remove('hidden');
                } else {
                    showError(data.error || "Analysis failed.");
                }
            } catch (err) {
                showError("Network error during analysis.");
            } finally {
                analyzeBtn.classList.remove('button-loading');
                analyzeBtn.disabled = false;
            }
        }

        function showError(msg) {
            const box = document.getElementById('errorBox');
            box.textContent = msg;
            box.classList.remove('hidden');
        }
    </script>
</body>
</html>
